name: password_mobile_app
description: Full Flutter app with Android installer + themes
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  dio: ^5.9.0
  encrypt: ^5.0.3
  pointycastle: ^3.6.1
  path_provider: ^2.0.15
  flutter_secure_storage: ^10.0.0-beta.4
  font_awesome_flutter: 10.12.0
  provider: ^6.0.5
  uuid: ^4.5.2
  local_auth: ^2.3.0
  shared_preferences: ^2.1.1
  biometric_storage: ^5.0.0
  share_plus: ^10.1.4
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/password-mobile-app-logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/password-mobile-app-logo.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/

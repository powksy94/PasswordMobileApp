name: password_mobile_app
description: Full Flutter app with Android installer + themes
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  open_file: ^3.5.10
  http: ^1.2.1
  dio: ^5.9.0
  encrypt: ^5.0.3
  pointycastle: ^3.6.1
  file_picker: 10.3.7
  path_provider: ^2.0.15
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^10.0.0-beta.4
  dynamic_color: ^1.6.6
  permission_handler: ^12.0.1
  font_awesome_flutter: 10.12.0
  provider: ^6.0.5
  lucide_icons: 0.257.0

  # ⚡ Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
